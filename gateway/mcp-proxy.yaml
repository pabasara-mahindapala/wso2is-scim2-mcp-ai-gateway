# WSO2 AI Gateway MCP proxy for the IS 7.3 SCIM2 MCP server (generated by arazzo-mcp-gen).
# mcp-auth policy validates Identity Server JWTs (issuer, signature, expiry, audience)
# mcp-authz policy requires per-tool IS scopes.
# Before registering, replace ${CLIENT_APP_ID} below with the client id of the "SCIM MCP Client" application.
apiVersion: gateway.api-platform.wso2.com/v1
kind: Mcp
metadata:
  name: is-scim2-mcp-v1.0
  annotations:
    "gateway.api-platform.wso2.com/project-id": "default"
spec:
  displayName: IS SCIM2 MCP
  version: v1.0
  context: /scim
  specVersions: ["2025-06-18", "2025-11-25"]
  upstream:
    # The gateway forwards /scim/mcp to exactly this URL, so /mcp must be included.
    url: http://scim-mcp-server:5000/mcp
  policies:
    - name: mcp-auth
      version: v1
      params:
        issuers:
          - WSO2IS          # key manager name from config.toml
        audiences:
          - ${CLIENT_APP_ID}   # client id of the SCIM MCP Client app
        requiredScopes:
          - internal_user_mgt_view
          - internal_user_mgt_list
          - internal_user_mgt_create
          - internal_user_mgt_update
          - internal_user_mgt_delete
          - internal_group_mgt_view
          - internal_group_mgt_create
          - internal_group_mgt_update
          - internal_group_mgt_delete
          - internal_role_mgt_view
          - internal_role_mgt_create
          - internal_role_mgt_update
          - internal_role_mgt_users_update
          - internal_role_mgt_groups_update
          - internal_role_mgt_permissions_update
          - internal_role_mgt_delete
          - internal_bulk_resource_create
          - internal_bulk_user_create
          - internal_agent_mgt_view
          - internal_agent_mgt_list
          - internal_agent_mgt_create
          - internal_agent_mgt_update
          - internal_agent_mgt_delete
    - name: mcp-authz
      version: v1
      params:
        # One rule per tool; a tool with no matching rule is ALLOWED, so every tool must be listed.
        tools:
          - name: list_users
            scopes:
              allOf: [internal_user_mgt_list]
          - name: search_users
            scopes:
              allOf: [internal_user_mgt_list]
          - name: get_user
            scopes:
              allOf: [internal_user_mgt_view]
          - name: create_user
            scopes:
              allOf: [internal_user_mgt_create]
          - name: update_user_attribute
            scopes:
              allOf: [internal_user_mgt_update]
          - name: update_user_profile
            scopes:
              allOf: [internal_user_mgt_update]
          - name: delete_user
            scopes:
              allOf: [internal_user_mgt_delete]
          - name: list_groups
            scopes:
              allOf: [internal_group_mgt_view]
          - name: create_group
            scopes:
              allOf: [internal_group_mgt_create]
          - name: add_user_to_group
            scopes:
              allOf: [internal_user_mgt_view, internal_group_mgt_update]
          - name: remove_user_from_group
            scopes:
              allOf: [internal_group_mgt_update]
          - name: delete_group
            scopes:
              allOf: [internal_group_mgt_delete]
          - name: list_roles
            scopes:
              allOf: [internal_role_mgt_view]
          - name: create_role
            scopes:
              allOf: [internal_role_mgt_create]
          - name: assign_role_to_user
            scopes:
              anyOf: [internal_role_mgt_update, internal_role_mgt_users_update]
          - name: remove_role_from_user
            scopes:
              anyOf: [internal_role_mgt_update, internal_role_mgt_users_update]
          - name: delete_role
            scopes:
              allOf: [internal_role_mgt_delete]
          - name: list_agents
            scopes:
              allOf: [internal_agent_mgt_list]
          - name: create_agent
            scopes:
              allOf: [internal_agent_mgt_create]
          - name: delete_agent
            scopes:
              allOf: [internal_agent_mgt_delete]
          - name: bulk_create_users
            scopes:
              anyOf: [internal_bulk_resource_create, internal_bulk_user_create]
  tools: []
  resources: []
  prompts: []
